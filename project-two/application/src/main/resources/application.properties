# Local educational demonstration; keep the private keystore outside the classpath.
server.address=127.0.0.1
server.port=8443
server.ssl.enabled=true
server.ssl.key-alias=artemis
server.ssl.key-store=${ARTEMIS_KEYSTORE_PATH:file:./artemis-keystore.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${ARTEMIS_KEYSTORE_PASSWORD}
